[project]
name = "redshift"
version = "0.1.0"
description = "Redshift: The Atmosphere Trade Studio. Microgravity fire evidence mapped against candidate lunar habitat atmospheres."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2.8",
  "cantera>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pypdf>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "dulwich>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redshift"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["redshift/units.py", "redshift/provenance.py", "redshift/transforms.py", "redshift/science"]
